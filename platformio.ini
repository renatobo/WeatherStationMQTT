; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
    build-profiles.ini
    mysecret_envs.ini
; create your own mysecret_envs.ini with your specific build information, e.g.
;
; [env:workshop]
; upload_protocol = espota
; build_flags = -Dworkshop
; upload_port = WORKSHOP-ESP.local
;

[env]
platform = espressif8266@4.2.1
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@1.200.0
board = d1_mini
board_build.f_cpu = 160000000L
framework = arduino
extra_scripts = pre:scripts/bounded_tls.py
monitor_speed = 115200
lib_ldf_mode = chain+
lib_deps = 
	bblanchon/ArduinoJson@6.21.6
	neptune2/simpleDSTadjust@1.2.0
	https://github.com/RobTillaart/DHTNew.git#8e1c45db649ca0db9cff87ce334fe0c88a243a2f
	https://github.com/ThingPulse/esp8266-oled-ssd1306#c69cd07db30295428a70d6fa8bb306bbcde64d5b
	https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
	knolleary/PubSubClient@2.8
	yiannisbourkelis/Uptime Library@1.0.0
